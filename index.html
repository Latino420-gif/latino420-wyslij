<style>
:root{color-scheme:dark;--pink:#ff3db4;--hot:#ff6aa8;--teal:#2ef0d4;--txt:#fff7fb;--mut:#f0c2dc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#1a0830}
body{min-height:100dvh;overflow-x:hidden}
/* iOS-safe full-screen bg: fixed layer + cover, NOT background-attachment:fixed */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;min-height:100dvh;
  background-color:#1a0830;
  background-image:url("bg-gta.jpg");
  background-image:image-set(url("bg-gta.webp") type("image/webp"),url("bg-gta.jpg") type("image/jpeg"));
  background-size:cover;background-position:50% 40%;background-repeat:no-repeat}
.bg::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;
  background:
    linear-gradient(180deg,rgba(18,0,36,.12) 0%,rgba(12,0,24,.22) 18%,rgba(10,0,20,.32) 55%,rgba(8,0,16,.18) 100%),
    radial-gradient(ellipse at 50% 110%,rgba(8,0,16,.28),transparent 50%)}
.wrap{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:16px 16px max(20px,env(safe-area-inset-bottom))}
.hero{text-align:center;margin:2px 0 12px;position:relative}
.tag{display:inline-block;margin:0 0 8px;padding:3px 10px;border:1px solid var(--teal);color:var(--teal);
  font-size:10px;font-weight:800;letter-spacing:.22em;border-radius:2px;
  background:rgba(8,0,16,.45);box-shadow:0 0 14px rgba(46,240,212,.55),0 0 28px rgba(255,61,180,.25);
  animation:tagpulse 2.4s ease-in-out infinite}
h1{margin:0;font-style:italic;font-weight:900;text-transform:uppercase;
  font-size:clamp(48px,16vw,70px);letter-spacing:-.06em;line-height:.82;
  background:linear-gradient(180deg,#fff 0%,#f3f6ff 18%,#b9c2d8 42%,#fff 52%,#ffc6ee 78%,#fff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 6px #ff3db4) drop-shadow(0 0 18px rgba(255,61,180,.85)) drop-shadow(3px 3px 0 #2ef0d4) drop-shadow(0 0 28px rgba(46,240,212,.45));
  animation:flicker 5.5s step-end infinite}
.sub{margin:12px 0 0;color:#fff;font-size:14px;font-weight:650;text-shadow:0 0 10px rgba(255,61,180,.6),0 2px 10px rgba(0,0,0,.7)}
.frame{position:relative;border-radius:20px;padding:2px;margin:12px 0;overflow:hidden;
  box-shadow:0 0 22px rgba(255,61,180,.28),0 0 40px rgba(46,240,212,.12),0 14px 32px rgba(0,0,0,.45)}
.frame::before{content:"";position:absolute;inset:-90%;background:conic-gradient(#ff3db4,#2ef0d4,#ff8a3a,#ff3db4,#7a5cff,#2ef0d4,#ff3db4);animation:spin 3.2s linear infinite}
.card{position:relative;z-index:1;border-radius:18px;padding:14px 14px 15px;
  background:linear-gradient(180deg,rgba(22,4,36,.9),rgba(8,0,18,.94));
  box-shadow:inset 0 1px 0 rgba(255,180,220,.16);
  backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35)}
h3{margin:0 0 6px;color:#ffd0ee;font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  text-shadow:0 0 10px rgba(255,80,200,.5)}
h3::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal),0 0 16px var(--teal);vertical-align:middle;animation:tagpulse 2s ease-in-out infinite}
.sub2{margin:0 0 10px;color:var(--mut);font-size:13px;line-height:1.45}
label{display:block;color:#f3c6e4;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:8px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;color:#fff;background:rgba(10,0,20,.6);
  border:1px solid rgba(255,80,200,.4);border-radius:12px;outline:none;transition:border-color .2s,box-shadow .2s}
select{appearance:none;-webkit-appearance:none;padding-right:42px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path fill='%232ef0d4' d='M4 6l4 5 4-5z'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-color:rgba(10,0,20,.6)}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,240,212,.28),0 0 18px rgba(255,61,180,.3)}
.code{font:800 italic 26px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase;padding:14px 8px;
  border-color:rgba(46,240,212,.55);box-shadow:0 0 18px rgba(46,240,212,.22),0 0 8px rgba(255,61,180,.15)}
.btn{width:100%;margin-top:10px;padding:14px 16px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#ff4ecb 0%,#ff3d8a 40%,#ff7a3a 100%);
  color:#1a0010;font-weight:800;font-size:16px;letter-spacing:.03em;
  box-shadow:0 0 22px rgba(255,61,180,.65),0 0 40px rgba(255,80,40,.3),0 8px 18px rgba(0,0,0,.4);
  transition:transform .2s,filter .2s,box-shadow .2s;animation:btnGlow 2.2s ease-in-out infinite}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;filter:none;box-shadow:none;animation:none}
.btn2{background:rgba(0,20,24,.45);border:1px solid var(--teal);color:var(--teal);box-shadow:0 0 16px rgba(46,240,212,.3);animation:none}
.btn2:hover{background:rgba(46,240,212,.12);filter:none}
.nl{margin:8px 0;padding:12px;border-radius:14px;border:1px solid rgba(255,80,200,.3);background:rgba(8,0,18,.4)}
.nl-h{display:flex;justify-content:space-between;align-items:center;color:#ffd0ee;margin-bottom:4px}
.nl-x{background:transparent;border:1px solid rgba(46,240,212,.45);color:var(--teal);border-radius:10px;padding:8px 12px;min-height:44px;min-width:44px;font-size:16px}
.nl-x:hover,.nl-x:focus-visible{background:rgba(46,240,212,.15);outline:none;box-shadow:0 0 12px rgba(46,240,212,.4)}
.hid{display:none!important}
#nmsg{text-align:center;margin:12px 0 0;min-height:22px;color:#ffd0ee;font-weight:650;line-height:1.45;text-shadow:0 1px 8px #000}
#nmsg.ok,#nmsg.err{padding:12px 14px;border-radius:12px;backdrop-filter:blur(10px)}
#nmsg.ok{color:#b8ffe8;background:rgba(20,80,70,.45);border:1px solid rgba(46,240,212,.5);box-shadow:0 0 16px rgba(46,240,212,.2)}
#nmsg.err{color:#ffd0e0;background:rgba(120,20,60,.45);border:1px solid rgba(255,80,140,.55);box-shadow:0 0 16px rgba(255,61,180,.2)}
.ver{text-align:center;color:rgba(255,230,245,.78);font-size:11px;line-height:1.5;margin:16px 8px 0;text-shadow:0 1px 8px rgba(0,0,0,.8)}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes flicker{
  0%,86%,90%,100%{opacity:1;filter:drop-shadow(0 0 6px #ff3db4) drop-shadow(0 0 18px rgba(255,61,180,.85)) drop-shadow(3px 3px 0 #2ef0d4) drop-shadow(0 0 28px rgba(46,240,212,.45))}
  87%{opacity:.78;filter:drop-shadow(0 0 2px #ff3db4) drop-shadow(3px 3px 0 #2ef0d4)}
  89%{opacity:.55;filter:drop-shadow(0 0 14px #2ef0d4) drop-shadow(3px 3px 0 #ff3db4)}
  91%{opacity:1}

</style></head><body>
<div class="bg" aria-hidden="true"></div>

<script>/* Latino420 – wysyłanie list przez internet (kod 8 znaków). Wspólne dla strony (iPhone/Safari) i aplikacji Latino420 Remote.
   Szyfrowanie na urządzeniu: PBKDF2-SHA256 + AES-256-GCM. Strona nie zapisuje list ani kodów. */
(function () {
  const ALPH = '23456789ABCDEFGHJKMNPQRSTUVWXYZ', RELAYS = ['https://ntfy.sh', 'https://ntfy.envs.net'], PREFIX = 'L420E1.';
  const te = new TextEncoder();
  const normCode = s => { const c = String(s || '').toUpperCase().replace(/[\s-]/g, ''); return c.length === 8 && [...c].every(x => ALPH.includes(x)) ? c : null; };
  async function pbkdf2(pass, salt, iter, bits) { const k = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, k, bits)); }
  const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  const b64u = b => { let s = ''; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
  async function topic(code) { return 'l420' + hex(await pbkdf2(code, te.encode('latino420-topic-v1'), 20000, 96)); }
  async function seal(code, tp, plain) { const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey('raw', await pbkdf2(code, salt, 50000, 256), 'AES-GCM', false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode(tp), tagLength: 128 }, key, te.encode(plain)));
    const all = new Uint8Array(16 + 12 + ct.length); all.set(salt); all.set(iv, 16); all.set(ct, 28); return PREFIX + b64u(all); }
  async function open(code, tp, env) { if (!env.startsWith(PREFIX)) return null; const b = unb64u(env.slice(PREFIX.length));
    const key = await crypto.subtle.importKey('raw', await pbkdf2(code, b.slice(0, 16), 50000, 256), 'AES-GCM', false, ['decrypt']);
    try { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(16, 28), additionalData: te.encode(tp), tagLength: 128 }, key, b.slice(28))); } catch (e) { return null; } }
  async function webSend(code, plain) { const tp = await topic(code), env = await seal(code, tp, plain);
    if (env.length > 3900) throw new Error('Za dużo danych – wyślij mniej list naraz');
    let err = ''; for (const r of RELAYS) { try { const x = await fetch(r + '/' + tp, { method: 'POST', body: env }); if (x.ok) return r; err = 'HTTP ' + x.status; } catch (e) { err = e.message; } }
    throw new Error('Przekaźnik niedostępny (' + err + ')'); }
  async function gz(plain) { if (typeof CompressionStream === 'undefined') throw new Error('Ta przeglądarka nie obsługuje wysyłania plików – zaktualizuj ją');
    return new Uint8Array(await new Response(new Blob([te.encode(plain)]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); }
  async function bigSend(code, plain) { const tp = await topic(code), salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey('raw', await pbkdf2(code, salt, 50000, 256), 'AES-GCM', false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode(tp), tagLength: 128 }, key, await gz(plain)));
    const all = new Uint8Array(6 + 28 + ct.length); all.set(te.encode('L420Z1')); all.set(salt, 6); all.set(iv, 22); all.set(ct, 34);
    if (all.length > 15000000) throw new Error('Plik za duży (max ok. 15 MB po kompresji)');
    const fn = 'l420' + hex(crypto.getRandomValues(new Uint8Array(6))) + '.bin';
    let err = ''; for (const r of RELAYS) { try { const x = await fetch(r + '/' + tp, { method: 'PUT', body: all, headers: { 'Filename': fn } }); if (x.ok) return r; err = 'HTTP ' + x.status; } catch (e) { err = e.message; } }
    throw new Error('Przekaźnik niedostępny (' + err + ')'); }
  async function anySend(code, plain) { const tp = await topic(code), env = await seal(code, tp, plain); return env.length <= 3900 ? webSend(code, plain) : bigSend(code, plain); }
  window.L420Net = { normCode, topic, seal, open, webSend, bigSend, anySend, ALPH };

  // ---------- UI ----------
  const $ = id => document.getElementById(id);
  let n = 0;
  function row() { const i = ++n, d = document.createElement('div'); d.className = 'nl'; d.dataset.i = i;
    d.innerHTML = `<div class="nl-h"><b>Lista ${document.querySelectorAll('.nl').length + 1}</b><button type="button" class="nl-x" aria-label="Usuń listę">✕</button></div>
      <label>Typ</label><select class="nl-t"><option value="m3u">Playlista M3U (URL)</option><option value="xtream">Xtream Codes</option><option value="mac">Portal MAC</option><option value="m3ufile">Plik M3U (z telefonu)</option></select>
      <label>Nazwa (opcjonalnie)</label><input class="nl-n" maxlength="60" placeholder="Moja lista">
      <div class="nl-uw"><label class="nl-ul">URL playlisty</label><input class="nl-u" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://..."></div>
      <div class="nl-mc hid"><label>Adres MAC</label><input class="nl-m" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="17" placeholder="00:1A:79:XX:XX:XX"></div>
      <div class="nl-fw hid"><label>Plik .m3u / .m3u8</label><input class="nl-f" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,application/x-mpegurl,application/vnd.apple.mpegurl,text/plain"></div>
      <div class="nl-xt hid"><label>Użytkownik</label><input class="nl-us" autocomplete="off" autocapitalize="off" spellcheck="false"><label>Hasło</label><input class="nl-pw" type="password" autocomplete="off"></div>
      <label>Własny EPG (opcjonalnie)</label><input class="nl-e" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://... .xml / .xml.gz">`;
    const t = d.querySelector('.nl-t'), upd = () => { const v = t.value, x = v === 'xtream'; d.querySelector('.nl-xt').classList.toggle('hid', !x); d.querySelector('.nl-mc').classList.toggle('hid', v !== 'mac');
      d.querySelector('.nl-fw').classList.toggle('hid', v !== 'm3ufile'); d.querySelector('.nl-uw').classList.toggle('hid', v === 'm3ufile');
      d.querySelector('.nl-ul').textContent = x ? 'URL serwera (http://host:port)' : v === 'mac' ? 'URL portalu (http://host:port/c/)' : 'URL playlisty'; };
    t.onchange = upd; upd(); d.querySelector('.nl-x').onclick = () => { if (document.querySelectorAll('.nl').length > 1) { d.remove(); renum(); } };
    $('nlists').appendChild(d); renum(); return d; }
  function renum() { document.querySelectorAll('.nl').forEach((d, i) => d.querySelector('.nl-h b').textContent = 'Lista ' + (i + 1)); }
  const readFile = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result || '')); r.onerror = () => no(new Error('Nie udało się odczytać pliku')); r.readAsText(f); });
  async function collect() { const out = []; for (const d of document.querySelectorAll('.nl')) { const v = c => d.querySelector(c).value.trim(), t = v('.nl-t');
      const lbl = () => v('.nl-n') || d.querySelector('.nl-h b').textContent;
      if (t === 'm3ufile') { const f = d.querySelector('.nl-f').files[0]; if (!f) throw new Error('Lista „' + lbl() + '”: wybierz plik M3U');
        const c = await readFile(f); if (!/#EXTINF|https?:\/\//i.test(c.slice(0, 200000))) throw new Error('Plik „' + f.name + '” nie wygląda na playlistę M3U');
        const o = { type: 'm3ufile', name: v('.nl-n') || f.name.replace(/\.m3u8?$/i, '').slice(0, 60), content: c };
        const e = v('.nl-e'); if (e) { if (!/^https?:\/\/\S+$/i.test(e)) throw new Error('Zły adres EPG'); o.epg = e; } out.push(o); continue; }
      const o = { type: t, name: v('.nl-n'), url: v('.nl-u') }; if (!/^https?:\/\/\S+$/i.test(o.url)) throw new Error('Lista „' + (o.name || d.querySelector('.nl-h b').textContent) + '”: podaj adres zaczynający się od http:// lub https://');
      if (t === 'mac') { const m = v('.nl-m').toUpperCase().replace(/[^0-9A-F]/g, ''); if (m.length !== 12) throw new Error('Portal MAC: podaj adres MAC (12 znaków, np. 00:1A:79:AB:CD:EF)'); o.mac = m.match(/../g).join(':'); }
      if (t === 'xtream') { o.username = v('.nl-us'); o.password = d.querySelector('.nl-pw').value; if (!o.username || !o.password) throw new Error('Xtream: podaj użytkownika i hasło'); }
      const e = v('.nl-e'); if (e) { if (!/^https?:\/\/\S+$/i.test(e)) throw new Error('Zły adres EPG'); o.epg = e; } out.push(o); }
    return out; }
  function msg(t, ok) { const m = $('nmsg'); m.textContent = t; m.className = ok === true ? 'ok' : ok === false ? 'err' : ''; }
  window.L420NetUI = function (nativeSend) {
    row(); $('nadd').onclick = () => { row().querySelector('.nl-u').focus(); };
    $('ncode').oninput = e => { const c = e.target.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 8); e.target.value = c.length > 4 ? c.slice(0, 4) + '-' + c.slice(4) : c; };
    $('nsend').onclick = async () => { const code = normCode($('ncode').value); if (!code) return msg('Wpisz 8-znakowy kod z ekranu telewizora (np. ABCD-2345)', false);
      let lists; try { lists = await collect(); } catch (e) { return msg(e.message, false); }
      const plain = JSON.stringify({ v: 1, lists }); $('nsend').disabled = true; msg(lists.some(l => l.type === 'm3ufile') ? 'Szyfrowanie i wysyłanie pliku… (może chwilę potrwać)' : 'Szyfrowanie i wysyłanie…');
      try { if (nativeSend) await nativeSend(code, plain); else await anySend(code, plain);
        msg(`✔ Wysłano ${lists.length} ${lists.length === 1 ? 'listę' : lists.length < 5 ? 'listy' : 'list'}. Sprawdź telewizor – lista pojawi się w „☰ Listy” w ciągu kilku sekund.`, true); }
      catch (e) { msg('✖ Nie wysłano: ' + e.message, false); } finally { $('nsend').disabled = false; } };
  };
})();

L420NetUI(null);</script></body></html>
